name: Trunk gate

# The only required CI for merging to main through the merge queue.
# The repository ruleset requires this status check context exactly:
#   Trunk gate / Required merge queue gate
# Pull requests targeting main run this job so the required check reports before
# enqueue. ci-advisory.yml remains optional fast feedback.
# ci-build.yml builds the artifact matrix. Promotion is promote-*.yml.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'

jobs:
  gate:
    name: Required merge queue gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache the wasm toolchain output
        id: cache-wasm
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm-bindgen-test-runner.exe
            target/wasm32-unknown-unknown
          key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen (cache miss only)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:anti-slop
      - run: npm run typecheck
      - run: npm run build
      - name: Root unit gate
        run: npm test
      - name: Publishable CLI bundle
        run: npm test --workspace @openpacker/cli -- test/release-bundle.test.ts
