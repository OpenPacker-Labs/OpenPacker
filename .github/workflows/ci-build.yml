name: CI build

# Post-merge artifact matrix on main. Automatic runs are Ubuntu 24.04 only
# (Node 22.22.2 and 24). Windows and macOS legs are opt-in on workflow_dispatch
# (they multiply Actions minutes and often queue behind billing limits). Pull
# requests use ci-advisory.yml for fast, non-required feedback. The merge queue
# uses trunk-gate.yml, which is the only required CI for merging. Scheduled
# security checks are separate in security.yml and codeql.yml. The full offline
# gauntlet stays manual-dispatch in ci.yml. Promotion is promote-nightly.yml,
# promote-integration.yml, and promote-prod.yml (cd.yml is deprecated). Minutes
# are budgeted: concurrency cancels superseded runs, npm/cargo caches are warm
# after the first run, and artifacts expire after 7 days.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_windows_macos:
        description:
          Also run Windows and macOS matrix legs (uses substantially more
          Actions minutes)
        type: boolean
        default: false

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'

jobs:
  matrix-prep:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INCLUDE_EXTRA: ${{ inputs.include_windows_macos }}
        run: |
          set -euo pipefail
          BASE='[{"os":"ubuntu-24.04","node":"22.22.2"},{"os":"ubuntu-24.04","node":"24"}]'
          EXTRA='[{"os":"windows-latest","node":"22.22.2"},{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"22.22.2"},{"os":"macos-latest","node":"24"}]'
          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$INCLUDE_EXTRA" = 'true' ]; then
            JSON="$(BASE="$BASE" EXTRA="$EXTRA" node -e 'const b=JSON.parse(process.env.BASE); const e=JSON.parse(process.env.EXTRA); console.log(JSON.stringify({include:[...b,...e]}))')"
          else
            JSON="$(BASE="$BASE" node -e 'console.log(JSON.stringify({include:JSON.parse(process.env.BASE)}))')"
          fi
          {
            echo 'matrix<<MATRIX_EOF'
            echo "$JSON"
            echo MATRIX_EOF
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: ./.github/actions/openpacker-turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache the wasm toolchain output
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 # v5.0.5
        with:
          # Windows installs both tools with an .exe suffix. Without it the
          # saved cache holds neither binary, the next run restores it, skips
          # the install and fails on a missing wasm-bindgen. The v2 key
          # abandons the entries that were saved without them.
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm-bindgen-test-runner.exe
            target/wasm32-unknown-unknown
          key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen (cache miss only)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - name: Handle-relative I/O against the real NT API (Windows)
        # Windows has no procfs, so child I/O is NtCreateFile with the parent
        # handle as RootDirectory, through koffi. The unit tests run this
        # path nowhere else.
        if: runner.os == 'Windows'
        run:
          npm run test -w @openpacker/project-io -- src/handle-windows.test.ts
      - name: Workspace-member links against the real NT API (Windows)
        # Directory junctions made relative to the parent handle
        # (NtCreateFile RootDirectory, FSCTL_SET_REPARSE_POINT, one rename),
        # how a junction is recognised (lstat answers from the reparse point,
        # because fstat never says "link"), the set-up those suites share, and
        # the link suite the other platforms run, against NTFS.
        if: runner.os == 'Windows'
        run:
          npm run test -w @openpacker/project-io --
          src/handle-windows-link.test.ts src/handle-windows-link.read.test.ts
          src/handle-windows-link-support.test.ts src/handle-link.test.ts
          src/handle-link.prefix.test.ts src/handle-link.read.test.ts
          src/handle-link.remove.test.ts src/member-link.test.ts
          src/member-link.prefix.test.ts src/member-link.tree.test.ts
      - run: npm run build
      - name: Test the publishable CLI bundle
        run: npm test --workspace @openpacker/cli -- test/release-bundle.test.ts
      - name: Smoke the CLI
        run: node apps/openpacker-cli/dist/main.js --help
      - name: Smoke opm project mutation (no-follow handle-relative I/O)
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          OPM: ${{ github.workspace }}/apps/openpacker-cli/dist/main.js
        run: |
          set -euo pipefail
          mkdir smoke-init
          (cd smoke-init && node "$OPM" init --name smoke-init) || { code=$?; echo "opm init exited with $code"; exit "$code"; }
          test -f smoke-init/opm.toml
          mkdir smoke-import && cd smoke-import
          printf '{"name":"smoke-import","version":"0.0.0","dependencies":{"left-pad":"1.3.0"}}\n' > package.json
          node "$OPM" import --native
          grep -q 'left-pad' opm.toml
      - name: Handle-relative I/O against the real libSystem (macOS)
        # macOS has no /proc/self/fd, so child I/O is libc openat/mkdirat/...
        # through koffi. This runs that backend with no override, and checks
        # its struct layouts and errno values against Node and Linux.
        if: runner.os == 'macOS'
        run: npm run test -w @openpacker/project-io -- src/handle-darwin.test.ts
      - name: Workspace-member links against the real libSystem (macOS)
        # symlinkat and readlinkat through koffi, with their first-use check
        # against fstatat, the whole link suite the Linux legs run through
        # /proc/self/fd and glibc, and the project-path API and tree walkers
        # over it, here on libSystem with no override.
        if: runner.os == 'macOS'
        run:
          npm run test -w @openpacker/project-io -- src/handle-link.test.ts
          src/handle-link.prefix.test.ts src/handle-link.read.test.ts
          src/handle-link.remove.test.ts src/member-link.test.ts
          src/member-link.prefix.test.ts src/member-link.tree.test.ts
      - name: Sandbox grants and pack output against the real libSystem (macOS)
        # The grants a sandboxed run opens, and the output a delegated pack
        # reads, are handle-relative: libc openat through koffi, never a name
        # joined onto /dev/fd/N, which names nothing on macOS (ADR 0045). This
        # runs both on the host that shows it; the same code runs on Linux
        # against glibc. It also checks that what cannot run on macOS (an
        # executable snapshot, a containment backend) is refused by name.
        if: runner.os == 'macOS'
        run: |
          npm run test -w @openpacker/sandbox -- src/sandbox.darwin.test.ts
          npm run test -w @openpacker/pack-provider -- src/pack.darwin.test.ts
      - name: Pack publishable packages
        # bash on every runner, and the directory first: npm does not create a
        # --pack-destination, and fails with ENOENT when it is missing.
        shell: bash
        run: |
          mkdir -p dist-artifacts
          npm run bundle --workspace @openpacker/cli
          npm pack --pack-destination dist-artifacts --prefix apps/openpacker-cli/release
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # v7.0.1
        with:
          name: openpacker-build-${{ matrix.os }}-node${{ matrix.node }}
          path: dist-artifacts/
          retention-days: 7
          overwrite: true
          if-no-files-found: error
