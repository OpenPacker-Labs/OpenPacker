name: Optional live compatibility

on:
  workflow_dispatch:
    inputs:
      zot_image:
        description: Zot image pinned as ghcr.io/project-zot/...@sha256:...
        required: true
        type: string
      oras_image:
        description: ORAS CLI image pinned by sha256 digest
        required: true
        type: string
      oras_version:
        description: Exact ORAS version exposed by oras version
        required: true
        type: string
      ocm_image:
        description: OCM CLI image pinned by sha256 digest
        required: true
        type: string
      ocm_version:
        description: Exact OCM version exposed by ocm version
        required: true
        type: string
      ocm_validate_args:
        description: JSON argv containing a {descriptor} placeholder
        required: true
        type: string

permissions:
  contents: read

jobs:
  registry-providers:
    runs-on: ubuntu-latest
    environment: live-compat
    env:
      OPENPACKER_LIVE_TESTS: '1'
      OPENPACKER_ZOT_IMAGE: ${{ inputs.zot_image }}
      OPENPACKER_ORAS_IMAGE: ${{ inputs.oras_image }}
      OPENPACKER_ORAS_VERSION: ${{ inputs.oras_version }}
      OPENPACKER_OCM_IMAGE: ${{ inputs.ocm_image }}
      OPENPACKER_OCM_VERSION: ${{ inputs.ocm_version }}
      OPENPACKER_OCM_VALIDATE_ARGS: ${{ inputs.ocm_validate_args }}
      OPENPACKER_LIVE_REPOSITORY: openpacker/live
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -- --filter='!@openpacker/embedded'
      - name: Create digest-pinned ORAS and OCM wrappers
        run: |
          docker pull "$OPENPACKER_ORAS_IMAGE"
          docker pull "$OPENPACKER_OCM_IMAGE"
          mkdir -p "$RUNNER_TEMP/openpacker-live-bin"
          cat > "$RUNNER_TEMP/openpacker-live-bin/oras" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v "$PWD:$PWD" -v /tmp:/tmp -w "$PWD" "$OPENPACKER_ORAS_IMAGE" "$@"
          EOF
          cat > "$RUNNER_TEMP/openpacker-live-bin/ocm" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v "$PWD:$PWD" -v /tmp:/tmp -w "$PWD" "$OPENPACKER_OCM_IMAGE" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/openpacker-live-bin/oras" "$RUNNER_TEMP/openpacker-live-bin/ocm"
      - name: Run pinned OCI, ORAS, and OCM interoperability
        run: node scripts/live-compat/run-with-zot.mjs
        env:
          OPENPACKER_ZOT_IMAGE: ${{ inputs.zot_image }}
          OPENPACKER_ORAS: ${{ runner.temp }}/openpacker-live-bin/oras
          OPENPACKER_OCM: ${{ runner.temp }}/openpacker-live-bin/ocm
