name: Release evidence

# Evidence generation — manual dispatch only (see ci.yml note); the promotion
# pipeline in cd.yml consumes ci-build.yml artifacts, not this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo build --workspace --all-features --release --locked
      - run: mkdir release
      - run:
          npm pack --workspace @openpacker/contracts --workspace @openpacker/sdk
          --workspace @openpacker/embedded --workspace @openpacker/cli
          --pack-destination release
      - run: npm sbom --sbom-format cyclonedx > openpacker-node.cdx.json
      - run: npm run release:sbom:rust -- openpacker-rust.cdx.json
      - run: sha256sum release/* > release/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openpacker-release-evidence
          path: |
            release/
            openpacker-node.cdx.json
            openpacker-rust.cdx.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: release/*
