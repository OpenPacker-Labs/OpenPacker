name: Release evidence

# Evidence generation — manual dispatch only (see ci.yml note); the promotion
# pipeline in cd.yml consumes ci-build.yml artifacts, not this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo build --workspace --all-features --release --locked
      - run: mkdir release
      - run: |
          npm run bundle --workspace @openpacker/cli
          npm pack --pack-destination release --prefix apps/openpacker-cli/release
      - run: npm sbom --sbom-format cyclonedx > openpacker-node.cdx.json
      - run: npm run release:sbom:rust -- openpacker-rust.cdx.json
      - run: sha256sum release/* > release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # v7.0.2
        with:
          name: openpacker-release-evidence
          path: |
            release/
            openpacker-node.cdx.json
            openpacker-rust.cdx.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 # v4.2.2
        with:
          subject-path: release/*
