name: Promote production

# Manual production promotion. There is no push trigger. The production
# GitHub Environment must require Tyler as a reviewer; this file cannot name
# the reviewer. Do not set an npm token secret. Trusted publishing uses OIDC.
on:
  workflow_dispatch:
    inputs:
      integration_sha:
        description:
          Commit SHA to publish. Must be the current tip of the integration
          branch. Promotion fast-forwards prod and does not rewrite it.
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: promote-prod
  cancel-in-progress: false

env:
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'
  OPENPACKER_MISE: mise
  TURBO_CONCURRENCY: '1'

jobs:
  confirm:
    name: integration_sha is the integration tip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
        with:
          ref: ${{ inputs.integration_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Reject anything other than a fast-forward of the integration tip
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration
          git fetch origin prod || true
          sha="$(git rev-parse "${INTEGRATION_SHA}^{commit}")"
          tip="$(git rev-parse origin/integration)"
          if [ "$sha" != "$tip" ]; then
            echo "integration_sha ${sha} is not the tip of origin/integration (${tip})." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet origin/prod >/dev/null; then
            if ! git merge-base --is-ancestor origin/prod "$sha"; then
              echo "origin/prod is not an ancestor of ${sha}; refusing a non-fast-forward." >&2
              exit 1
            fi
          fi
          test "$(git rev-parse HEAD)" = "$sha"

  promote:
    name: Production promotion
    needs: confirm
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
        with:
          ref: ${{ inputs.integration_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Re-check the integration tip before publishing
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration
          git fetch origin prod || true
          sha="$(git rev-parse "${INTEGRATION_SHA}^{commit}")"
          tip="$(git rev-parse origin/integration)"
          if [ "$sha" != "$tip" ]; then
            echo "integration moved. integration_sha ${sha} is not the tip (${tip})." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet origin/prod >/dev/null; then
            if ! git merge-base --is-ancestor origin/prod "$sha"; then
              echo "origin/prod is not an ancestor of ${sha}; refusing a non-fast-forward." >&2
              exit 1
            fi
          fi
          test "$(git rev-parse HEAD)" = "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        id: tip
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache the wasm toolchain output
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm-bindgen-test-runner.exe
            target/wasm32-unknown-unknown
          key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen (cache miss only)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4 # v4.2.4
        with:
          version: 2026.7.13
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm exec playwright install --with-deps chromium
      - run: npm run verify
      - run: node scripts/release/changelog-entry-check.mjs
      - run: node scripts/release/semver-gate.mjs --prod
      - run: node scripts/release/npm-pack-gate.mjs
      - name: CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > openpacker-node.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # v7.0.1
        with:
          name: openpacker-prod-sbom
          path: openpacker-node.cdx.json
          if-no-files-found: error
      - name: Audit is clean at high severity
        run: npm audit --audit-level=high
      - name: Audit release bundle dependencies
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp apps/openpacker-cli/release/package.json "${work}/package.json"
          (
            cd "$work"
            npm install --package-lock-only --ignore-scripts
            npm audit --audit-level=high --omit=dev
          )
      - name: Reject prerelease dependencies in the release manifest
        run:
          node scripts/release/semver-gate.mjs --no-prerelease-deps
          apps/openpacker-cli/release/package.json
      - name: Attest provenance of the release tarball
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0 # v4.1.0
        with:
          subject-path: apps/openpacker-cli/release/*.tgz
      - name: Create release GitHub App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 # v3.3.0
        with:
          app-id: ${{ secrets.OPENPACKER_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENPACKER_RELEASE_APP_KEY }}
      - name: Fast-forward prod
        env:
          SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration
          git fetch origin prod || true
          tip="$(git rev-parse origin/integration)"
          test "$SHA" = "$tip"
          if git rev-parse --verify --quiet origin/prod >/dev/null; then
            git merge-base --is-ancestor origin/prod "$SHA"
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${SHA}:refs/heads/prod"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
      - name: Publish the latest dist-tag with provenance
        working-directory: apps/openpacker-cli/release
        shell: bash
        run: npm publish --provenance --access public --tag latest
