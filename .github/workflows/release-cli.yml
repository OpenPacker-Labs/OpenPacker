name: Release CLI

# Manual alpha release from main. Creates a git tag and a GitHub prerelease
# with the npm pack tarball. Does not fast-forward nightly, integration, or
# prod. Provenance uses id-token: write on this public repository. NPM_TOKEN,
# when set, is the npm publish fallback. An empty secret leaves registry auth
# to OIDC trusted publishing. Never print tokens.
on:
  workflow_dispatch:
    inputs:
      skip_verify:
        description: Skip npm run verify before publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-cli
  cancel-in-progress: false

env:
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'
  OPENPACKER_MISE: mise

jobs:
  release:
    name: Release CLI
    runs-on: ubuntu-latest
    environment:
      name: integration
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Plan the alpha release
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:7}"
          plan_file="$(mktemp)"
          # release_title contains spaces and parentheses. A heredoc keeps the
          # whole value; name=value is easy to split on the first equals.
          write_output() {
            local name="$1"
            local value="$2"
            local delim="OP${RANDOM}${RANDOM}${RANDOM}"
            {
              printf '%s<<%s\n' "$name" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }
          node scripts/release/plan-cli-release.mjs --mode alpha --sha "$short" | tee "$plan_file"
          while IFS= read -r line || [ -n "$line" ]; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              version|tag|release_title|short_sha|npm_dist_tag|also_github_packages)
                write_output "$key" "$value"
                ;;
            esac
          done < "$plan_file"
          got_short="$(sed -n 's/^short_sha=//p' "$plan_file")"
          test "$got_short" = "$short"
          write_output sha "$sha"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache the wasm toolchain output
        id: cache-wasm
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm-bindgen-test-runner.exe
            target/wasm32-unknown-unknown
          key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen (cache miss only)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - name: Install mise for the offline demo
        if: inputs.skip_verify == false || inputs.skip_verify == 'false'
        uses: jdx/mise-action@v4.2.4
        with:
          version: 2026.7.13
          cache: false
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        if: inputs.skip_verify == false || inputs.skip_verify == 'false'
        run: npm exec playwright install --with-deps chromium
      # opm contract tests execute the built CLI bins.
      - name: Build workspace packages
        if: inputs.skip_verify == false || inputs.skip_verify == 'false'
        run: npm run build
      - name: Full offline verification
        if: inputs.skip_verify == false || inputs.skip_verify == 'false'
        run: npm run verify
      - name: Bundle the alpha version
        env:
          OPENPACKER_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: npm run bundle --workspace @openpacker/cli
      - name: Pack the npm tarball
        id: pack
        working-directory: apps/openpacker-cli/release
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --json | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8'))[0].filename")"
          test -n "$tarball"
          test -f "$tarball"
          case "$tarball" in
            *.tgz) ;;
            *)
              echo "npm pack did not report a tarball: ${tarball}" >&2
              exit 1
              ;;
          esac
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        uses: ./.github/actions/publish-openpacker-cli
        with:
          npm-dist-tag: alpha
          publish-github-packages: 'false'
          npm-token: ${{ secrets.NPM_TOKEN }}

      # publish: false installs npm 11.21.1 and writes NPM_CONFIG_USERCONFIG.
      # An empty NPM_TOKEN leaves no _authToken line, so dist-tag can use OIDC.
      # A non-empty token stores the ${NODE_AUTH_TOKEN} placeholder. The
      # dist-tag step sets that variable. It is never written to GITHUB_ENV.
      - name: Configure npm for dist-tag
        uses: ./.github/actions/publish-openpacker-cli
        with:
          publish: 'false'
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Point alpha and next at this version
        working-directory: apps/openpacker-cli/release
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm dist-tag add "@openpacker/cli@${VERSION}" alpha --registry https://registry.npmjs.org
          npm dist-tag add "@openpacker/cli@${VERSION}" next --registry https://registry.npmjs.org

      - name: Create and push the git tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-parse "${TAG}^{commit}")"
            test "$existing" = "$SHA"
          else
            git tag "$TAG" "$SHA"
          fi
          # Tag only. Do not fast-forward nightly, integration, or prod.
          git push origin "refs/tags/${TAG}"

      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.release_title }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHORT_SHA: ${{ steps.plan.outputs.short_sha }}
          SHA: ${{ steps.plan.outputs.sha }}
          TARBALL: apps/openpacker-cli/release/${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          printf '%s\n' \
            "@openpacker/cli ${VERSION}" \
            "" \
            "npm version: ${VERSION}" \
            "Build metadata: +${SHORT_SHA}" \
            "" \
            "npm publishes this semver without +build metadata. npm strips build metadata, so the short git SHA is recorded in the release title and in these notes." \
            "" \
            "Git commit: ${SHA}" \
            "Git tag: ${TAG}" \
            "npm dist-tags: alpha and next. latest is unchanged." \
            > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --target "$SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes-file "$notes"
          fi

      # The mirror runs after the tag and GitHub Release. A GitHub Packages
      # rejection then does not drop those. npm publish in this second call
      # sees the version already on npmjs and skips it.
      - name: Mirror the release on GitHub Packages
        uses: ./.github/actions/publish-openpacker-cli
        with:
          npm-dist-tag: alpha
          publish-github-packages: 'true'
          npm-token: ${{ secrets.NPM_TOKEN }}
