name: CI

# The full offline gauntlet — manual dispatch only. Pull requests use
# ci-advisory.yml. The merge queue requires trunk-gate.yml. ci-build.yml is the
# post-merge artifact matrix on main. Scheduled security checks are in
# security.yml and codeql.yml. Promotion is promote-nightly.yml,
# promote-integration.yml, and promote-prod.yml (cd.yml is deprecated).
# Quality gates are still enforced locally: .githooks/pre-commit
# (agent:check --staged), .githooks/pre-push (agent:check --base=origin/main),
# and `npm run verify` before merge. Do not add automatic triggers to this
# workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'

jobs:
  node-compat:
    name: Node ${{ matrix.node }} SDK compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npx turbo run build
      - run: npm run test:compat

  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run:
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked

  platform-compat:
    name: CLI, materializer, and mise contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4 # v4.2.4
        with:
          version: 2026.7.13
          cache: false
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run:
          npm run build -- --filter='...@openpacker/cli'
          --filter='...@openpacker/materializer'
      - run:
          npm exec -- vitest run --config scripts/vitest.gate.config.mjs
          apps/openpacker-cli packages/materializer
      - run: node --test integrations/mise/test/contract.test.mjs
      - run: mise --version

  contracts-security-integration:
    name: Offline contracts, security, integration, and fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm run check:contracts
      - run: npm run check:generated
      - run: npm run build
      - run: npm run test:conformance
      - run: npm run test:security
      - run: npm run test:integration
      - run: npm run test:fuzz
      - run: npm run benchmark

  wasm-browser:
    name: WASM and Playwright Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm exec playwright install --with-deps chromium
      - run: npx turbo run build --filter=@openpacker/embedded...
      - run: npm run test:browser

  dependency-audit:
    name: Dependency licenses and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
      - run: npm ci --ignore-scripts
      # Populate crates.io cache so offline cargo metadata succeeds.
      - run: cargo fetch --locked
      - run: node scripts/check-licenses.mjs
      - run: npm audit --audit-level=high
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  full-verify:
    name: Full offline verification and demo
    runs-on: ubuntu-latest
    needs:
      [
        node-compat,
        rust,
        contracts-security-integration,
        wasm-browser,
        dependency-audit,
        platform-compat,
      ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4 # v4.2.4
        with:
          version: 2026.7.13
          cache: false
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm ci --ignore-scripts
      - run: npm exec playwright install --with-deps chromium
      - run: npm run verify
        env:
          OPENPACKER_MISE: mise
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # v7.0.1
        if: always()
        with:
          name: openpacker-verification-artifacts
          path: |
            .demo-output/
            coverage/
          if-no-files-found: error
