name: CI advisory

# Fast pull-request feedback. This workflow is not a required check.
# Trunk gate (.github/workflows/trunk-gate.yml) is required on pull requests
# and in the merge queue.
on:
  pull_request:
    branches: [main, 'cursor/**']
  workflow_dispatch:

concurrency:
  group: ci-advisory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  OPENPACKER_OFFLINE: '1'
  SOURCE_DATE_EPOCH: '1785628800'

jobs:
  fast:
    name: Fast advisory (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch PR base for affected Turbo scope
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - uses: ./.github/actions/openpacker-turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          read-only:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.fork && 'true' || 'false' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
        if: github.event_name == 'pull_request'
        with:
          targets: wasm32-unknown-unknown
      - name: Cache the wasm toolchain output
        if: github.event_name == 'pull_request'
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm-bindgen-test-runner.exe
            target/wasm32-unknown-unknown
          key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen (cache miss only)
        if:
          github.event_name == 'pull_request' &&
          steps.cache-wasm.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - run: npm run format:check
      - run: npm run lint:anti-slop
      - name: Affected typecheck (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/ci/run-scoped-turbo.mjs typecheck
      - name: Affected build (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/ci/run-scoped-turbo.mjs build
      - name: Record that this check is advisory
        run: |
          set -euo pipefail
          {
            echo "### Advisory only"
            echo ""
            echo "This pull request workflow is not a required check. Trunk gate (\`Trunk gate / Required merge queue gate\`) from \`.github/workflows/trunk-gate.yml\` runs on this pull request and again in the merge queue. That job is the only required CI for merging."
            echo ""
            echo "On pull requests, typecheck and build run in **affected-only** Turbo scope (full gate in the merge queue). Set \`OPENPACKER_CI_FULL=1\` on a workflow re-run to force the full monorepo."
          } >> "$GITHUB_STEP_SUMMARY"
