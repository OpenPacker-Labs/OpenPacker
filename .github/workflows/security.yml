name: Security and dependency checks

on:
  pull_request:
    branches: [main, 'cursor/**']
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  OPENPACKER_OFFLINE: '1'

jobs:
  dependency-audit:
    name: Dependency audit and license policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: cargo fetch --locked
      - run: node scripts/check-licenses.mjs
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  offline-security:
    name: Offline security regression gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:anti-slop
      - run: npm run check:test-inventory
      - run: npm run build
      - run: npm run test:security
      - run: node --test scripts/codex-security.test.mjs
