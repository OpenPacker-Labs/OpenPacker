name: OpenPacker build setup
description: >-
  Checkout, Node.js, the Rust wasm32 target, wasm-bindgen 0.2.126, and npm ci
  --ignore-scripts. The wasm cache key matches ci-build.yml.

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: 22.19.0

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # v6.0.2
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0 # 1.88.0
      with:
        targets: wasm32-unknown-unknown
    - name: Cache the wasm toolchain output
      id: cache-wasm
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 # v5.0.5
      with:
        # Windows installs both tools with an .exe suffix. Without it the
        # saved cache holds neither binary, the next run restores it, skips
        # the install and fails on a missing wasm-bindgen. The v2 key
        # abandons the entries that were saved without them.
        path: |
          ~/.cargo/bin/wasm-bindgen
          ~/.cargo/bin/wasm-bindgen.exe
          ~/.cargo/bin/wasm-bindgen-test-runner
          ~/.cargo/bin/wasm-bindgen-test-runner.exe
          target/wasm32-unknown-unknown
        key: wasm-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
    - name: Install wasm-bindgen (cache miss only)
      if: steps.cache-wasm.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked wasm-bindgen-cli --version 0.2.126
    - name: Install npm dependencies
      shell: bash
      run: npm ci --ignore-scripts
