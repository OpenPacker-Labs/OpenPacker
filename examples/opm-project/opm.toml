# Example Open Package Manager project (offline fixture)
[project]
name = "opm-example"
ecosystems = ["npm", "cargo", "pypi"]

[packages.demo-tool]
purl = "pkg:npm/@openpacker/demo-tool"
version = "1.1.0"
# Relative to this example dir; points at repo fixtures
source = "file:../../fixtures/opm/demo-tool-1.1.0.tgz"

[options]
offline = true
layout = "opm"

# Package install/execution jail (ADR 0036). Defaults when omitted:
# enabled, fail-closed, prefer auto (native bwrap/seatbelt when present, else MXC).
[sandbox]
enabled = true
mode = "fail-closed"
prefer = "auto"
