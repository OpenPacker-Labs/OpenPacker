# Example Open Package Manager project (offline fixture)
[project]
name = "opm-example"
ecosystems = ["npm", "cargo", "pypi"]

[packages.demo-tool]
purl = "pkg:npm/@openpacker/demo-tool"
version = "1.1.0"
# Relative to this example dir; points at repo fixtures
source = "file:../../fixtures/opm/demo-tool-1.1.0.tgz"

[options]
offline = true
layout = "opm"

[policy]
allow_yanked = false
allow_quarantined = false
semantic_loss_maximum = "warning"
allow_lifecycle_scripts = false
minimum_release_age_minutes = 1440
trust_policy = "no-downgrade"
block_exotic_transitive = true
block_exotic_direct = false

# Package install/execution jail (ADR 0036). Defaults when omitted:
# enabled, fail-closed, prefer auto (native bwrap/seatbelt when present, else MXC).
[sandbox]
enabled = true
mode = "fail-closed"
prefer = "auto"
allow_host_unsandboxed_install = false
