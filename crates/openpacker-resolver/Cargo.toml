[package]
name = "openpacker-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
resolvo = "0.12.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[[bench]]
name = "bounded_oracle"
harness = false

[dev-dependencies]
serde_jcs = "0.2.0"

# Unused alias. resolvo -> ahash (runtime-rng) still links getrandom 0.3.4.
# Feature unification does not cross the workspace getrandom 0.4 dependency,
# so this wasm32-only pin turns on wasm_js for that 0.3 crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

